<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="menu">
    <h1>To-Do List</h1>
  <ul class="todo-list">
    
    <section class="section1">
    <li>
      <input type="checkbox" id="input1">
      <label for="input1">Build a personal portfolio</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://github.com/" target="_blank">Github</a></li>
      </ul>
    </li>
    </section>

    <section class="section2">
    <li>
      <input type="checkbox" id="input2">
      <label for="input2">Finish a CSS project</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://developer.mozilla.org/" target="_blank">MDN</a></li>
      </ul>
    </li>
    </section>
    
    <section class="section3">
    <li>
      <input type="checkbox" id="input3">
      <label for="input3">Create a responsive website</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://www.w3.org/" target="_blank">W3C</a></li>
      </ul>
    </li>
    </section>

    <section class="section4">
    <li>
      <input type="checkbox" id="input4">
      <label for="input4">Practice HTML & CSS</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://html.spec.whatwg.org/" target="_blank">WHATWG</a></li>
      </ul>
    </li>
    </section>

  </ul>
  </div>
</body>

</html>
